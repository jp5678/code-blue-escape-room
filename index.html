<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Blue : 잠긴 병동 · AI융합 간호정보학 방탈출</title>
<meta name="description" content="AI융합 간호정보학 학기 종합 복습용 조별 방탈출 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== Hospital Burgundy · 화이트와 버건디 간호스테이션 테마 =====
 * 퓨어 화이트(업무 화면) · 버건디(대학병원 엠블럼, 상단 바·제목) · 그래파이트(글자) · 은은한 골드(포인트)
 * 위험 표시는 버건디와 구분되는 주홍빛 빨강. 환자 모니터·코드 편집기만 실제 장비처럼 어두운 화면 */
:root {
  --primary: #6E2233;      /* 버건디 */
  --primary-2: #8C3A4C;    /* 밝은 버건디: 선택·완료 */
  --secondary: #4A4F57;    /* 그래파이트 */
  --accent: #C9A3AC;       /* 더스티 로즈 */
  --gold: #C8A96A;         /* 은은한 골드 */
  --gold-soft: #F7EFE0;
  --amber: #7A5A20;
  --danger: #C4320A;       /* 위험: 주홍빛 빨강 */
  --danger-soft: #FDEEE8;
  --warn: #B7791F;
  --info: #6E2233;

  --bg: #F6F6F7;
  --bg-tile: rgba(42, 45, 51, 0.03);
  --surface: #FFFFFF;
  --surface-2: #FAFAFB;
  --surface-3: #EFEFF2;
  --ink: #2A2D33;
  --text: #2A2D33;
  --muted: #5F636B;
  --line: #E1E1E6;
  --line-strong: #C3C5CC;
  --shadow: 0 1px 2px rgba(42, 45, 51, .05), 0 8px 22px rgba(42, 45, 51, .07);
  --radius: 14px;

  --serif: 'Noto Serif KR', 'Nanum Myeongjo', serif;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { font-size: clamp(14px, 0.35vw + 9px, 16.5px); }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--sans); line-height: 1.55;
  /* 병동 바닥 타일 느낌의 옅은 격자 */
  background:
    linear-gradient(var(--bg-tile) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, var(--bg-tile) 1px, transparent 1px) 0 0 / 40px 40px,
    var(--bg);
}
body.danger-pulse { animation: dangerBg 1.2s ease-in-out 3; }
@keyframes dangerBg { 50% { box-shadow: inset 0 0 160px rgba(196, 50, 10, .3); } }
h1, h2, h3 { font-family: var(--serif); line-height: 1.3; margin: 0 0 .5em; color: var(--primary); }
a { color: var(--info); }
code, kbd { font-family: var(--mono); background: var(--surface-3); padding: .05em .35em; border-radius: 6px; color: var(--primary); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.small { font-size: .85rem; color: var(--muted); }
.hidden { display: none !important; }

/* ----- 카드(EMR 창) ----- */
.glass {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ----- 상단 EMR 바 ----- */
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding: .55rem 1.25rem; background: var(--primary); color: #fff;
  border-bottom: 0; box-shadow: 0 2px 10px rgba(110, 34, 51, .25);
}
.brand { display: flex; align-items: center; gap: .6rem; margin-right: auto; min-width: 0; }
.brand .logo { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: #fff; color: var(--primary); font-weight: 900; font-size: 1.2rem; }
.brand h1 { font-size: 1.45rem; letter-spacing: .01em; margin: 0; white-space: nowrap; color: #fff; }
.brand .team { color: #F2DDE2; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ward-chip { font-size: .78rem; padding: .15rem .6rem; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .3); white-space: nowrap; }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; background: rgba(0, 0, 0, .18); padding: .2rem .6rem; border-radius: 10px; }
.stat .k { font-size: .7rem; color: #F2DDE2; letter-spacing: .04em; }
.stat .v { font-family: var(--mono); font-size: 1.15rem; font-weight: 600; color: #fff; }
.stat .v.over { color: #FCA5A5; }
.stat .v.low { color: var(--gold); }
.icon-btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: .3rem .6rem; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--surface-3); }
.topbar .icon-btn { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .3); color: #fff; }
.topbar .icon-btn:hover { background: rgba(255, 255, 255, .24); }
.manual-link { text-decoration: none; white-space: nowrap; font-weight: 700; }
/* 헤더 사용 설명서 버튼: ward-chip(7병동 간호스테이션)과 같은 크기·모양 */
.manual-chip { font-size: .78rem; padding: .15rem .6rem; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .3); color: #fff; font-weight: 400; }
.manual-chip:hover { background: rgba(255, 255, 255, .24); }
.badge { display: inline-flex; align-items: center; gap: .3rem; padding: .1rem .55rem; border-radius: 999px; font-size: .75rem; border: 1px solid var(--line-strong); background: var(--surface-3); color: var(--primary); white-space: nowrap; }
.badge.gold { color: var(--amber); background: var(--gold-soft); border-color: #E0CB9B; }
.badge.red { color: var(--danger); background: var(--danger-soft); border-color: #FCA5A5; }
.topbar .badge { background: rgba(255, 255, 255, .14); color: #fff; border-color: rgba(255, 255, 255, .35); }

/* EMR 상태 스트립: 정상(초록·✓·실선) / 잠김(빨강·🔒·흐르는 사선 경고 줄무늬). 하위 시스템 칩으로 복구 현황 표시 */
.emr-status { max-width: 1880px; margin: 12px auto 0; padding: 0 1.25rem; }
.emr-strip { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .4rem .55rem; border-radius: 12px;
  background: #ECFDF3; border: 1px solid #A7E3BE; border-left: 5px solid #2F855A; transition: background .3s, border-color .3s; }
.emr-pill { display: inline-flex; align-items: center; gap: .4rem; padding: .18rem .7rem .18rem .35rem; border-radius: 999px;
  background: #2F855A; color: #fff; font-weight: 800; font-size: .85rem; white-space: nowrap; }
.emr-icon { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .22); font-size: .75rem; }
.emr-sys { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; font-weight: 700; white-space: nowrap;
  padding: .12rem .55rem; border-radius: 999px; border: 1px solid #A7E3BE; background: #fff; color: #276749; }
.emr-sys.bad { color: #B91C1C; border-color: #FCA5A5; background: #FFF5F5; }
.emr-bar { flex: 1 1 120px; height: 8px; border-radius: 4px; background: #2F855A; min-width: 80px; }
body.emr-locked .emr-strip { background: #FEF2F2; border-color: #FCA5A5; border-left-color: #DC2626; }
body.emr-locked .emr-pill { background: #DC2626; }
body.emr-locked .emr-icon { animation: emrPulse 1.2s ease-in-out infinite; }
body.emr-locked .emr-bar {
  background: repeating-linear-gradient(135deg, #DC2626 0 10px, #FECACA 10px 20px);
  background-size: 28.28px 100%; animation: emrStripe .8s linear infinite;
}
@keyframes emrStripe { from { background-position: 0 0; } to { background-position: 28.28px 0; } }
@keyframes emrPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .7); } 50% { box-shadow: 0 0 0 5px rgba(255, 255, 255, 0); } }
@media (prefers-reduced-motion: reduce) { body.emr-locked .emr-bar, body.emr-locked .emr-icon { animation: none; } }

/* ----- 레이아웃: 업무 화면(좌) + 스테이션 장비(우) ----- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 480px; gap: 1.25rem; padding: 1.25rem; max-width: 1880px; margin: 0 auto; }
.side { display: flex; flex-direction: column; gap: 1rem; position: sticky; top: 78px; align-self: start; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 1rem; }
footer.foot { text-align: center; color: var(--muted); font-size: .8rem; padding: 1.25rem 1rem 1.75rem; border-top: 1px solid var(--line); margin-top: 1rem; background: var(--surface-2); }
.panel-title { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font: 700 .85rem var(--sans); color: var(--primary); margin: 0 0 .45rem; }
.panel-title .small { font-weight: 400; }

/* ----- 중앙 환자 모니터 (실제 장비처럼 어두운 화면 + 밝은 베젤) ----- */
.monitor-wrap { padding: .7rem; background: linear-gradient(180deg, #FBFBFC, #ECECF0); }
.monitor { padding: .75rem; font-family: var(--mono); background: #16181C; color: #E7E8EC; border-radius: 10px; border: 3px solid #3A3D44; }
.monitor.alarm { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(196, 50, 10, .25); }
.mon-head { display: flex; justify-content: space-between; align-items: baseline; font-size: .78rem; color: #A3A7B0; margin-bottom: .35rem; font-family: var(--sans); }
.mon-head b { color: #fff; }
.ecg { width: 100%; height: 64px; display: block; background: #0E1013; border-radius: 6px; }
.vitals { display: grid; grid-template-columns: repeat(3, 1fr); gap: .4rem; margin-top: .5rem; }
.vital { background: #1E2025; border: 1px solid #2C2F36; border-radius: 8px; padding: .3rem .5rem; }
.vital .k { font-size: .66rem; color: #A3A7B0; }
.vital .v { font-size: 1.15rem; font-weight: 600; line-height: 1.1; transition: color .4s; }
.vital .u { font-size: .65rem; color: #A3A7B0; margin-left: .15rem; }
.vital.hr .v { color: #7DD3FC; } .vital.spo2 .v { color: #38BDF8; } .vital.bp .v { color: #F9A8D4; }
.vital.rr .v { color: #FDE047; } .vital.temp .v { color: #FDBA74; } .vital.avpu .v { color: #C4B5FD; }
.vital.avpu .v { font-size: .95rem; line-height: 1.6; white-space: nowrap; }
.vital.bad .v { color: #F87171 !important; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .45; } }
.mon-foot { display: flex; gap: .45rem; margin-top: .5rem; flex-wrap: wrap; }
.mon-chip { flex: 1 1 45%; border-radius: 8px; padding: .3rem .55rem; font-size: .78rem; border: 1px solid #34373F; background: #1E2025; }
.mon-chip b { font-size: 1rem; }
.mon-chip .small { color: #A3A7B0; }
/* 잠김(계산 불가)·입력 끊김은 모두 이상 상태이므로 빨간 경고. 잠김은 고정, 입력 끊김은 깜빡임으로 구분 */
.mon-chip.locked, .mon-chip.flicker { color: #F87171; border-color: #B91C1C; background: rgba(127, 29, 29, .28); }
.mon-chip.locked .small, .mon-chip.flicker .small { color: #FCA5A5; }
.mon-chip.flicker { animation: blink .7s steps(2) infinite; }
.mon-chip.lv-high { border-color: #EF4444; color: #FCA5A5; }
.mon-chip.lv-medium { border-color: #F59E0B; color: #FCD34D; }
.mon-chip.lv-low-medium, .mon-chip.lv-low { border-color: var(--gold); color: var(--gold); }
.deter { height: 6px; border-radius: 3px; background: #2C2F36; margin-top: .5rem; overflow: hidden; }
.deter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold), var(--danger)); transition: width .8s; }

/* ----- 병동 현황판 (화이트보드) ----- */
.minimap { padding: .75rem; background: #FFFFFF; border: 2px solid #C9CBD2; box-shadow: inset 0 0 0 4px #F5F5F7, var(--shadow); }
.minimap h3 { font-size: .9rem; margin-bottom: .35rem; }
.minimap svg { width: 100%; height: auto; display: block; }
.mm-room rect { fill: #F7F7F9; stroke: #C3C5CC; stroke-width: 1.2; transition: all .4s; }
.mm-room text { fill: var(--muted); font-size: 10px; font-family: var(--sans); text-anchor: middle; }
.mm-room.cleared rect { fill: #F3E6E9; stroke: var(--primary-2); }
.mm-room.cleared text { fill: var(--primary); font-weight: 700; }
.mm-room.current rect { fill: #FBF4E4; stroke: var(--gold); stroke-width: 2.2; animation: pulse 1.6s ease-in-out infinite; }
.mm-room.current text { fill: var(--amber); font-weight: 700; }
.mm-room.off rect { fill: url(#hatch); stroke-dasharray: 3 3; opacity: .6; }
.mm-room.off text { opacity: .5; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
.mm-corr { fill: #F1F1F4; stroke: #DCDDE2; }

/* ----- 업무 화면: 구역 머리(차트 헤더) ----- */
.room-head { padding: 0; overflow: hidden; }
.room-head > .row { padding: .9rem 1.35rem .2rem; }
.room-head > .obj { padding: 0 1.35rem; }
.room-head > .story { margin: .7rem 1.35rem 1.1rem; }
.room-head::before { content: '환자 차트 · 712호 김○○ (72/M) · 지역사회획득 폐렴 3일차 · 담당: 정보간호사 대응팀'; display: block; padding: .4rem 1.35rem; font-size: .8rem; font-weight: 600; color: #5A1A28; background: #F7ECEE; border-bottom: 1px solid #EAD3D8; box-shadow: inset 4px 0 0 var(--primary); }
.room-head .row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.room-head h2 { font-size: 1.35rem; margin: 0; }
.room-head .obj { color: #3F434B; font-size: .9rem; margin: .45rem 0 0; }
.room-head .obj b { color: var(--primary); margin-right: .3rem; }
/* 구역 머리 배지: 교재 장은 로즈·버건디, 나머지는 진한 회색 글자 */
.room-head .badge { color: #3F434B; background: #F1F1F4; border-color: #D3D5DB; }
.room-head .badge.gold { color: var(--primary); background: #F7ECEE; border-color: #E2C3CA; font-weight: 600; }
.story { padding: .75rem 1rem; border-left: 4px solid var(--gold); background: #FCF7EC; border-radius: 0 10px 10px 0; font-size: .95rem; color: #2A2D33; line-height: 1.7; }
.steps { display: flex; gap: .45rem; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: .4rem; padding: .3rem .75rem; border-radius: 8px 8px 0 0; border: 1px solid var(--line); border-bottom-width: 3px; font-size: .8rem; color: var(--muted); background: var(--surface-2); }
.step.active { color: var(--primary); border-bottom-color: var(--gold); background: #fff; font-weight: 700; }
.step.done { color: var(--primary-2); border-bottom-color: var(--accent); }

/* ----- 퍼즐 카드 ----- */
.puzzle { padding: 1rem 1.2rem; }
.puzzle h3 { font-size: 1.1rem; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.prompt { margin: .2rem 0 1rem; }
.prompt ul.rules { margin: .5rem 0 0; padding: .6rem .8rem .6rem 1.8rem; color: var(--ink); font-size: .9rem; background: var(--gold-soft); border: 1px solid #E5D3A8; border-radius: 10px; }
.view { margin-bottom: 1rem; overflow-x: auto; }
.fields { display: grid; gap: .5rem; }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(190px, 300px); gap: .7rem; align-items: center; padding: .35rem .65rem; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.field-row label { font-size: .92rem; }
.field-row.sbar { border-left: 4px solid var(--gold); background: #FFFCF6; }
.field-row .from { display: block; font-size: .72rem; color: var(--amber); }
select, input[type=text], input[type=number], input[type=password] {
  width: 100%; padding: .38rem .6rem; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink); min-height: 38px; font-size: .95rem;
}
select:focus, input:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(110, 34, 51, .18); outline: none; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-weight: 700; margin-bottom: .4rem; color: var(--primary); }
.choice-grid { display: grid; gap: .45rem; }
.choice { display: flex; gap: .6rem; align-items: flex-start; padding: .45rem .7rem; font-size: .93rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; transition: all .2s; }
.choice:hover { background: var(--surface-3); }
.choice input { margin-top: .3rem; accent-color: var(--primary); width: 1.1rem; height: 1.1rem; flex: none; }
.choice.sel { border-color: var(--primary-2); background: #F6E9EC; }
.pick-note { font-size: .8rem; color: var(--amber); margin-left: .4rem; font-weight: 400; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-top: 1.1rem; }
.btn { border: 0; border-radius: 8px; padding: .45rem 1rem; font-weight: 700; cursor: pointer; min-height: 38px; font-size: .95rem; transition: transform .1s, filter .2s; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: #fff; box-shadow: 0 3px 10px rgba(110, 34, 51, .25); }
.btn.gold { background: var(--gold); color: #2B1F05; box-shadow: 0 3px 10px rgba(150, 115, 40, .25); }
.btn.ghost { background: #fff; color: var(--primary); border: 1px solid var(--line-strong); }
.btn.danger { background: var(--danger-soft); color: var(--danger); border: 1px solid #FCA5A5; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.feedback { min-height: 1.6em; font-weight: 700; }
.feedback.ok { color: var(--primary); } .feedback.bad { color: var(--danger); } .feedback.info { color: var(--amber); }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.hints { margin-top: 1rem; display: grid; gap: .45rem; }
.hint { padding: .55rem .8rem; border-radius: 10px; background: var(--gold-soft); border: 1px dashed var(--gold); font-size: .92rem; }
.hint b { color: var(--amber); }

/* ----- 다양한 응답 형식 ----- */
/* 카드 분류 */
.bucket-hint { margin: 0 0 .4rem; }
.bucket-board { display: grid; gap: .6rem; }
.bucket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .6rem; }
.bucket { border: 1.5px dashed var(--line-strong); border-radius: 12px; background: var(--surface-2); min-height: 96px; display: flex; flex-direction: column; transition: background .15s, border-color .15s; }
.bucket.tray { background: #fff; border-style: solid; border-color: var(--line); min-height: 64px; }
.bucket.over { border-color: var(--primary-2); background: #F6E9EC; }
.bucket-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; width: 100%; padding: .35rem .6rem; border: 0; border-bottom: 1px solid var(--line); background: var(--surface-3); color: var(--primary); font-weight: 700; font-size: .85rem; text-align: left; border-radius: 11px 11px 0 0; cursor: default; }
.bucket.tray .bucket-head { background: var(--surface-2); color: var(--muted); }
.bucket-head.armed { cursor: pointer; background: var(--gold-soft); color: var(--amber); }
.bucket-head.armed:hover { background: #EFE2C6; }
.bucket-head .count { font-family: var(--mono); font-size: .78rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 0 .45rem; color: var(--muted); }
.bucket-body { display: flex; flex-wrap: wrap; gap: .4rem; padding: .5rem; flex: 1; align-content: flex-start; }

    rr.forEach(([x, s]) => check('NEWS2 호흡수 ' + x, CORE.news2Parts.rr(x), s));
    const sp = [[91, 3], [92, 2], [93, 2], [94, 1], [95, 1], [96, 0]];
    sp.forEach(([x, s]) => check('NEWS2 SpO2(Scale 1) ' + x, CORE.news2Parts.spo2(x), s));
    check('NEWS2 산소 투여', CORE.news2Parts.o2(true), 2);
    check('NEWS2 실내 공기', CORE.news2Parts.o2(false), 0);
    const sbp = [[90, 3], [91, 2], [100, 2], [101, 1], [110, 1], [111, 0], [219, 0], [220, 3]];

    check('NEWS2 대응: 단일 항목 3점', CORE.news2Response(withV({ rr: 26 })).level, 'low-medium');
    check('NEWS2 대응: 5점=중간', CORE.news2Response(withV({ rr: 22, spo2: 94, hr: 104, temp: 38.6 })).level, 'medium');

    check('qSOFA 3항목 모두 → 3', CORE.calcQSOFA(withV({ rr: 30, sbp: 85, avpu: 'V' })), 3);

    // 입력 검증
    let threw = false;

    check('잘못된 입력은 예외', threw, true);

<script>
(function () {

'use strict';

const DATA = ROOMS;
const SALT = DATA.meta.salt;
const STORE_KEY = 'cbni_escape_v1';
const PREF_KEY = 'cbni_escape_prefs';
const CLASS_ROOMS_KEY = 'cbni_escape_class_rooms';
const $ = (sel, rootEl) => (rootEl || document).querySelector(sel);

/**

  const el = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);

    if (c === null || c === undefined || c === false) return;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);

}

function fmtTime(sec) {
  const neg = sec < 0;
  const s = Math.abs(Math.round(sec));
  const m = Math.floor(s / 60);
  return (neg ? '-' : '') + String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

  get(key, fallback) {
    try {

    }

  set(key, value) {
    try {

const Sound = (() => {
  let ctx = null;

    if (ctx || muted) return ctx;

    const g = c.createGain();

}

    v: 1, team, mode, diff,

    plan: buildPlan(mode),

/* 환자 경과 기록: 결과 화면 경과 그래프용. 20초마다, 악화 점수 0.1 이상 변화, 구간 이동 시 표본 저장 */

  const t = Math.round(elapsedMs() / 1000);

  const course = S.course || [];
  const last = course[course.length - 1];
  if (!force && last && t - last.t < 20 && Math.abs(points - last.p) < 0.1 && room === last.r) return;
  if (last && last.t === t) return;
  setS({ course: course.concat([{ t, p: Math.round(points * 100) / 100, r: room }]).slice(-600) });
}

/* ----- 통계 ----- */
function gradedPuzzles(room) {
  return room.puzzles.filter((p) => p.graded !== false);
}
function sectionStats(roomId) {
  const room = ROOM_BY_ID[roomId];
  let attempts = 0, solved = 0, hints = 0, skipped = 0;
  gradedPuzzles(room).forEach((p) => {
    const st = getP(pkey(roomId, p.id));
    hints += st.hints;
    if (st.skipped) { skipped += 1; return; }
    attempts += st.attempts;
    if (st.solved) solved += 1;
  });
  const accuracy = attempts ? Math.round((solved / attempts) * 100) : null;
  return { attempts, solved, hints, skipped, accuracy, sec: Math.round(S.sectionSec[roomId] || 0) };
}
function chapterStats() {
  const map = {};
  S.plan.forEach((roomId) => {
    gradedPuzzles(ROOM_BY_ID[roomId]).forEach((p) => {
      const st = getP(pkey(roomId, p.id));
      const cur = map[p.chapter] || { attempts: 0, solved: 0, hints: 0 };
      map[p.chapter] = st.skipped ? cur : {
        attempts: cur.attempts + st.attempts,
        solved: cur.solved + (st.solved ? 1 : 0),
        hints: cur.hints + st.hints
      };
    });
  });
  return Object.entries(map).map(([ch, v]) => {
    const accuracy = v.attempts ? Math.round((v.solved / v.attempts) * 100) : null;
    const weak = accuracy !== null && (accuracy < 70 || v.hints >= 2);
    return Object.assign({ ch, accuracy, weak }, v);
  }).sort((a, b) => chapterOrder(a.ch) - chapterOrder(b.ch));
}
function chapterOrder(ch) {
  const m = /Ch(\d+)/.exec(ch);
  return m ? Number(m[1]) : 99;
}
function totalHints() {
  return Object.values(S.puzzles).reduce((s, p) => s + p.hints, 0);
}

const TL = DATA.timeline;

function lerp(a, b, f) { return a + (b - a) * f; }
function vitalsAt(points) {
  const i = Math.min(TL.length - 1, Math.floor(points));
  const j = Math.min(TL.length - 1, i + 1);
  const f = points - i;
  const a = TL[i];
  const b = TL[j];
  const pick = f > 0.5 ? b : a;
  return Object.freeze({
    rr: Math.round(lerp(a.rr, b.rr, f)),
    spo2: Math.round(lerp(a.spo2, b.spo2, f)),
    onO2: pick.onO2,
    sbp: Math.round(lerp(a.sbp, b.sbp, f)),
    hr: Math.round(lerp(a.hr, b.hr, f)),
    avpu: pick.avpu,
    temp: Math.round(lerp(a.temp, b.temp, f) * 10) / 10
  });
}
function simClock(points) {

/* ----- ECG ----- */
const ECG = { x: 0, phase: 0, last: 0, prevY: null };
function ecgShape(p) {
  const bump = (c, w, a) => a * Math.exp(-Math.pow((p - c) / w, 2));
  return bump(0.12, 0.03, 0.12) - bump(0.27, 0.008, 0.15) + bump(0.3, 0.012, 1) - bump(0.33, 0.01, 0.3) + bump(0.55, 0.05, 0.25);
}
function ecgFrame(ts) {
  const cv = $('#ecg');
  const ctx = cv.getContext('2d');
  const dt = ECG.last ? Math.min(0.1, (ts - ECG.last) / 1000) : 0;
  ECG.last = ts;
  const hr = currentVitals.hr || 80;
  ECG.phase = (ECG.phase + dt * hr / 60) % 1;
  const speed = cv.width / 4;
  const nx = ECG.x + dt * speed;
  const y = cv.height * 0.62 - ecgShape(ECG.phase) * cv.height * 0.5;
  ctx.fillStyle = '#0E1013';
  ctx.fillRect(ECG.x, 0, Math.max(2, nx - ECG.x) + 12, cv.height);
  ctx.strokeStyle = '#7DD3FC';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ECG.x, ECG.prevY === null ? y : ECG.prevY);
  ctx.lineTo(nx, y);
  ctx.stroke();
  ECG.prevY = y;
  ECG.x = nx >= cv.width ? 0 : nx;
  if (nx >= cv.width) ECG.prevY = null;
  requestAnimationFrame(ecgFrame);
}
function startEcg() {
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = $('#ecg');
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0E1013';
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (reduce) {
    ctx.strokeStyle = '#7DD3FC';
    ctx.beginPath();
    for (let x = 0; x < cv.width; x++) {
      const y = cv.height * 0.62 - ecgShape((x / 150) % 1) * cv.height * 0.5;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    return;
  }
  requestAnimationFrame(ecgFrame);
}

const G_NODES = { OCS: [90, 55], EMR: [320, 150], LIS: [550, 55], PACS: [90, 245], CDSS: [550, 245] };
const G_EDGES = { e1: ['OCS', 'EMR', 0], e2: ['EMR', 'LIS', -11], e3: ['LIS', 'EMR', -11], e4: ['PACS', 'EMR', 0], e5: ['EMR', 'CDSS', -11], e6: ['CDSS', 'EMR', -11] };

/* ===== 04b-widgets.js — 다양한 응답 형식 =====
 *  ① 카드 분류(layout:'buckets'): 카드를 끌어 놓거나, 카드 → 상자 순으로 눌러 분류

 *  ③ 순서 맞추기(type:'order'): ▲▼ 버튼이나 끌어서 카드 순서 바꾸기
 * 값은 기존과 같이 setFieldValue로 저장하므로 해시 채점·저장·이어하기가 그대로 동작한다. */

/** SBAR 카드의 출처 표시(획득한 방 / 기본 제공 / 현장 메모) */
function cardTag(puz, f) {
  if (!puz.isSbar) return null;
  if (!f.fromRoom) return h('span', { class: 'from' }, '🃏 현장 메모');
  const played = S.plan.includes(f.fromRoom);
  return h('span', { class: 'from' }, played ? '🃏 ' + ROOM_BY_ID[f.fromRoom].clue.label : '🃏 기본 제공 카드');
}

/* ----- ① 카드 분류 ----- */
function bucketBoard(puz, key, fields, onChange) {
  const opts = displayOptions(fields[0], key, puz);
  const solved = () => getP(key).solved;
  let picked = null; // 눌러서 고른 카드(화면 상태일 뿐 저장하지 않음)
  const board = h('div', { class: 'bucket-board' });
  const hint = h('p', { class: 'small bucket-hint', 'aria-live': 'polite' });

  const move = (fid, value) => {
    if (solved()) return;
    picked = null;
    onChange(fid, value);
    draw();
  };
  const cardEl = (f) => h('button', {
    type: 'button', class: 'sort-card' + (picked === f.id ? ' picked' : ''), draggable: solved() ? null : 'true',
    'aria-pressed': picked === f.id ? 'true' : 'false', disabled: solved(),
    onclick: () => { picked = picked === f.id ? null : f.id; draw(); },
    ondragstart: (e) => { e.dataTransfer.setData('text/plain', f.id); e.dataTransfer.effectAllowed = 'move'; }
  }, cardTag(puz, f), h('span', {}, fieldLabel(puz, f)));

  const zone = (value, title, extraClass) => {
    const items = fields.filter((f) => (getP(key).values[f.id] || '') === value);
    const z = h('div', { class: 'bucket ' + (extraClass || '') });
    z.addEventListener('dragover', (e) => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', (e) => { e.preventDefault(); z.classList.remove('over'); const fid = e.dataTransfer.getData('text/plain'); if (fid) move(fid, value); });
    z.append(
      h('button', {
        type: 'button', class: 'bucket-head' + (picked ? ' armed' : ''), disabled: solved(),
        'aria-label': title + (picked ? ' 상자로 고른 카드 옮기기' : ' 상자'),
        onclick: () => { if (picked) move(picked, value); }
      }, h('span', {}, title), h('span', { class: 'count' }, String(items.length))),
      h('div', { class: 'bucket-body' }, ...items.map(cardEl)));
    return z;
  };
  function draw() {
    board.replaceChildren(
      zone('', '📥 아직 분류하지 않은 카드', 'tray'),
      h('div', { class: 'bucket-grid' }, ...opts.map((o) => zone(o.v, o.t))));
    hint.textContent = picked ? '옮길 상자의 제목을 누르세요. 같은 카드를 다시 누르면 선택이 풀립니다.' : '카드를 끌어 상자에 놓거나, 카드를 누른 뒤 상자 제목을 누르세요.';
  }
  draw();
  return h('div', {}, hint, board);
}

/* ----- ② 버튼 선택 ----- */
function segmentedField(puz, key, f, val, disabled, onChange) {
  const opts = displayOptions(f, key, puz);
  const group = h('div', { class: 'segbtns', role: 'radiogroup', 'aria-label': f.label });
  const draw = (cur) => group.replaceChildren(...opts.map((o) => h('button', {
    type: 'button', role: 'radio', 'aria-checked': cur === o.v ? 'true' : 'false', class: 'segbtn' + (cur === o.v ? ' on' : ''), disabled,
    onclick: () => { onChange(o.v); draw(o.v); }
  }, o.t)));
  draw(val);
  return h('div', { class: 'field-row seg-row' }, h('div', { class: 'seg-label' }, f.label), group);
}

/* ----- ③ 순서 맞추기 ----- */
function orderField(puz, key, f, val, disabled, onChange) {
  const ids = f.options.map((o) => o.v);
  const valid = Array.isArray(val) && val.length === ids.length && ids.every((v) => val.includes(v));
  let cur = valid ? val.slice() : seededShuffle(ids, sessionSeed() + '|order|' + key + '|' + f.id);
  if (!valid) onChange(cur); // 처음 섞인 순서도 답으로 저장(움직이지 않고 제출해도 채점 가능)
  const text = Object.fromEntries(f.options.map((o) => [o.v, o.t]));
  const bottomUp = f.stack === 'bottomUp'; // 1번이 맨 아래(피라미드)
  const list = h('ol', { class: 'order-list' + (bottomUp ? ' pyramid' : '') });
  const upTo = (i) => (bottomUp ? i + 1 : i - 1);   // 화면에서 위쪽에 놓인 칸
  const downTo = (i) => (bottomUp ? i - 1 : i + 1); // 화면에서 아래쪽에 놓인 칸
  const commit = (next) => { cur = next; onChange(cur); draw(); };
  const swap = (i, j) => {
    if (disabled || j < 0 || j >= cur.length) return;
    const next = cur.slice();
    [next[i], next[j]] = [next[j], next[i]];
    commit(next);
  };
  function draw() {
    list.replaceChildren(...cur.map((v, i) => {
      const width = bottomUp ? 'width:' + (100 - i * 9) + '%' : null; // 위로 갈수록 좁아지는 피라미드
      const li = h('li', { class: 'order-item', style: width, draggable: disabled ? null : 'true' },
        h('span', { class: 'order-no' }, String(i + 1)),
        h('span', { class: 'order-text' }, text[v]),
        h('span', { class: 'order-btns' },
          h('button', { type: 'button', class: 'icon-btn', 'aria-label': (i + 1) + '번째 카드 위로', disabled: disabled || upTo(i) < 0 || upTo(i) >= cur.length, onclick: () => swap(i, upTo(i)) }, '▲'),
          h('button', { type: 'button', class: 'icon-btn', 'aria-label': (i + 1) + '번째 카드 아래로', disabled: disabled || downTo(i) < 0 || downTo(i) >= cur.length, onclick: () => swap(i, downTo(i)) }, '▼')));
      li.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', String(i)));
      li.addEventListener('dragover', (e) => e.preventDefault());
      li.addEventListener('drop', (e) => {
        e.preventDefault();
        const from = Number(e.dataTransfer.getData('text/plain'));
        if (disabled || !Number.isInteger(from) || from === i) return;
        const next = cur.slice();
        const [moved] = next.splice(from, 1);
        next.splice(i, 0, moved);
        commit(next);
      });
      return li;
    }));
  }
  draw();
  return h('fieldset', {}, h('legend', {}, f.label, h('span', { class: 'pick-note' }, '(▲▼ 버튼이나 끌어서 순서 바꾸기)')), list);
}

/* ===== 05-puzzle.js — 구간·퍼즐 렌더링, 제출(해시 비교), 힌트, 디브리핑 ===== */

/* ----- 팀별 고정 셔플: 같은 게임(팀·시작 시각)에서는 새로고침·이어하기 후에도 순서가 같다 ----- */
function seededRandom(seedText) {
  let a = parseInt(CORE.sha256Hex(seedText).slice(0, 8), 16) >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/** 원본 배열은 그대로 두고 섞인 새 배열을 돌려준다. 3개 이상이면 원래 순서가 그대로 나오지 않게 한다. */
function seededShuffle(items, seedText) {
  const rand = seededRandom(seedText);
  const out = items.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  const unchanged = out.every((x, i) => x === items[i]);
  return unchanged && out.length > 2 ? out.slice(1).concat(out[0]) : out;
}
const sessionSeed = () => (S ? S.startedAt + '|' + S.team : 'preview');

function displayFields(puz, key) {
  const fields = activeFields(puz, S.diff);
  if (!puz.shuffleFields) return fields;
  const basic = fields.filter((f) => !f.adv);
  return seededShuffle(basic, sessionSeed() + '|fields|' + key).concat(fields.filter((f) => f.adv));
}
function displayOptions(f, key, puz) {
  if (f.fixedOrder || !Array.isArray(f.options)) return f.options;
  // 기본: 같은 퍼즐의 같은 보기 세트는 같은 순서(분류형 문항을 읽기 쉽게).
  // 1:1 짝짓기 퍼즐은 문항마다 따로 섞어 「1·2·3·4」 대각선 패턴이 생기지 않게 한다.
  const perField = puz && puz.optionOrderPerField ? '|' + f.id : '';
  return seededShuffle(f.options, sessionSeed() + '|opts|' + key + perField + '|' + f.options.map((o) => o.v).join(','));
}

function renderSection() {
  const room = currentRoom();
  const head = h('section', { class: 'room-head glass' },
    h('div', { class: 'row' },
      h('span', { style: 'font-size:1.8rem', 'aria-hidden': 'true' }, room.icon),
      h('h2', {}, room.name),
      ...room.chapters.map((c) => h('span', { class: 'badge gold' }, c === '부록1' ? '부록 1' : 'Chapter ' + c.replace('Ch', ''))),
      h('span', { class: 'badge' }, '권장 ' + room.minutes + '분'),
      h('span', { class: 'badge' }, '구간 ' + (S.idx + 1) + ' / ' + S.plan.length)),
    h('p', { class: 'obj' }, h('b', {}, '🎯 학습목표'), room.objective),
    h('div', { class: 'story', html: room.story }));
  const steps = h('nav', { class: 'steps', 'aria-label': '퍼즐 진행' }, room.puzzles.map((p, i) => {
    const st = getP(pkey(room.id, p.id));
    const cls = st.solved || st.skipped ? 'done' : i === S.pIdx ? 'active' : '';
    return h('span', { class: 'step ' + cls, 'aria-current': i === S.pIdx ? 'step' : null },
      (st.solved || st.skipped ? '✓ ' : '') + p.id + ' · ' + p.title);
  }));
  const body = S.pIdx >= room.puzzles.length ? renderSectionClear(room) : renderPuzzle(room, room.puzzles[S.pIdx]);
  $('#main').replaceChildren(head, h('div', { class: 'glass', style: 'padding:.6rem .9rem' }, steps), body);
  renderMinimap();
  if (S.pIdx < room.puzzles.length) refreshView(room, room.puzzles[S.pIdx], pkey(room.id, room.puzzles[S.pIdx].id));
}

function renderPuzzle(room, puz) {
  const key = pkey(room.id, puz.id);
  const st = getP(key);
  const fields = displayFields(puz, key);
  const onChangeOf = (fid, v) => fieldChanged(room, puz, key, fid, v);
  const body = puz.layout === 'buckets'
    ? [bucketBoard(puz, key, fields.filter((f) => !f.adv), onChangeOf), ...fields.filter((f) => f.adv).map((f) => renderField(room, puz, key, f, st))]
    : fields.map((f) => renderField(room, puz, key, f, st));
  const form = h('form', { class: 'fields', novalidate: true, onsubmit: (e) => { e.preventDefault(); submitPuzzle(room, puz); } }, ...body);
  const hintBtn = h('button', {
    type: 'button', class: 'btn ghost', id: 'hintBtn', disabled: st.hints >= 3 || st.solved,
    onclick: () => useHint(room, puz)
  }, '💡 힌트 ' + st.hints + '/3' + (st.hints < 3 ? ' (+' + DATA.config.hintPenaltySec[st.hints] / 60 + '분)' : ''));
  const submitBtn = st.solved
    ? h('button', { type: 'button', class: 'btn primary', 'data-autofocus': true, onclick: () => advancePuzzle() }, '다음 ▶')
    : h('button', { type: 'submit', class: 'btn primary', form: 'pform' }, puz.graded === false ? '제출하고 탈출 ▶' : '제출 (Enter)');
  form.id = 'pform';
  const actions = h('div', { class: 'actions' }, submitBtn, puz.graded === false ? null : hintBtn,
    st.solved && puz.debriefX ? h('button', { type: 'button', class: 'btn ghost', onclick: () => showDebrief(room, puz, st.debKey, false) }, '📖 디브리핑 다시 보기') : null,
    typeof teacherPuzzleTools === 'function' ? teacherPuzzleTools(room, puz) : null);
  const hints = h('div', { class: 'hints', id: 'hintList' }, ...(puz.hintsX || []).slice(0, st.hints).map((x, i) =>
    h('div', { class: 'hint' }, h('b', {}, ['① 넛지', '② 부분 공개', '③ 거의 정답'][i] + ' '), decryptHint(x))));
  return h('section', { class: 'puzzle glass', id: 'puzzleCard' },
    h('h3', {}, '퍼즐 ' + puz.id + ' · ' + puz.title, h('span', { class: 'badge' }, puz.kind),
      h('span', { class: 'badge gold' }, puz.chapter === '부록1' ? '부록 1' : 'Chapter ' + puz.chapter.replace('Ch', ''))),
    h('div', { class: 'prompt', html: puz.prompt }),
    renderView(puz.view, room, puz, key),
    form,
    actions,
    h('div', { class: 'feedback ' + (st.solved ? 'ok' : ''), id: 'fb', role: 'status', 'aria-live': 'polite' }, st.solved ? '✔ 해결한 퍼즐입니다.' : ''),
    hints);
}

function fieldChanged(room, puz, key, fieldId, v) {
  setFieldValue(key, fieldId, v);
  refreshView(room, puz, key);
  const fb = $('#fb');
  if (fb && fb.classList.contains('bad')) { fb.textContent = ''; fb.className = 'feedback'; }
}

function fieldLabel(puz, f) {
  if (!puz.isSbar || !f.fromRoom) return f.label;
  return ROOM_BY_ID[f.fromRoom].clue.text;
}

function renderField(room, puz, key, f, st) {
  const val = st.values[f.id];
  const id = 'f_' + f.id;
  const disabled = st.solved;
  const onChange = (v) => fieldChanged(room, puz, key, f.id, v);
  if (f.type === 'order') return orderField(puz, key, f, val, disabled, onChange);
  if (f.type === 'select' && f.render === 'segmented') return segmentedField(puz, key, f, val, disabled, onChange);
  if (f.type === 'select') {
    const sel = h('select', { id, disabled, onchange: (e) => onChange(e.target.value) },
      h('option', { value: '' }, '— 선택 —'),
      ...displayOptions(f, key, puz).map((o) => h('option', { value: o.v, selected: val === o.v }, o.t)));
    return h('div', { class: 'field-row' + (puz.isSbar ? ' sbar' : '') }, h('label', { for: id }, cardTag(puz, f), fieldLabel(puz, f)), sel);
  }
  if (f.type === 'number' || f.type === 'text') {
    const input = h('input', {
      id, type: f.type === 'number' ? 'text' : 'text', inputmode: f.type === 'number' ? 'decimal' : null,
      value: val === undefined ? '' : String(val), placeholder: f.placeholder || (f.unit ? '숫자 입력 (' + f.unit + ')' : ''),
      maxlength: f.maxLength || (f.type === 'number' ? 8 : 40), disabled, autocomplete: 'off',
      oninput: (e) => onChange(e.target.value)
    });
    return h('div', { class: 'field-row' }, h('label', { for: id }, f.label + (f.unit ? ' (' + f.unit + ')' : '')), input);
  }
  if (f.type === 'radio' && f.render === 'codeLines') {
    return h('p', { class: 'small', id: 'lineNote', 'aria-live': 'polite' }, val ? '선택한 줄: ' + val + '번' : '위 코드에서 버그가 있는 줄을 누르세요');
  }
  const multi = f.type === 'checks';
  const cur = multi ? (Array.isArray(val) ? val : []) : val;
  const group = h('div', { class: 'choice-grid' }, ...displayOptions(f, key, puz).map((o) => {
    const checked = multi ? cur.includes(o.v) : cur === o.v;
    const input = h('input', {
      type: multi ? 'checkbox' : 'radio', name: key + '_' + f.id, value: o.v, checked, disabled, 'data-field': f.id,
      onchange: () => {
        const next = multi
          ? $$('input[data-field="' + f.id + '"]').filter((x) => x.checked).map((x) => x.value)
          : o.v;
        $$('input[data-field="' + f.id + '"]').forEach((x) => x.closest('.choice').classList.toggle('sel', x.checked));
        onChange(next);
      }
    });
    return h('label', { class: 'choice' + (checked ? ' sel' : '') }, input, h('span', {}, o.t));
  }));
  const note = multi ? h('span', { class: 'pick-note' }, f.pick ? '(' + f.pick + '개 선택)' : '(해당하는 것 모두)') : null;
  return h('fieldset', {}, h('legend', {}, f.label, note), group);
}

function isEmpty(f, v) {
  if (f.type === 'checks') return !Array.isArray(v) || v.length === 0;
  if (f.type === 'order') return !Array.isArray(v) || v.length !== f.options.length;
  return v === undefined || v === null || String(v).trim() === '';
}
function setFeedback(cls, msg) {
  const fb = $('#fb');
  if (!fb) return;
  fb.className = 'feedback ' + cls;
  fb.textContent = msg;
}

function submitPuzzle(room, puz) {
  const key = pkey(room.id, puz.id);
  const st = getP(key);
  if (st.solved) return;
  const fields = activeFields(puz, S.diff);
  const missing = fields.find((f) => isEmpty(f, st.values[f.id]) && !(puz.graded === false && f.type === 'text'));
  if (missing) { setFeedback('info', puz.layout === 'buckets' ? '아직 분류하지 않은 카드가 있습니다. 모든 카드를 상자에 넣으세요.' : '모든 항목을 입력하거나 선택하세요.'); return; }
  const wrongCount = fields.find((f) => f.type === 'checks' && f.pick && st.values[f.id].length !== f.pick);
  if (wrongCount) { setFeedback('info', '「' + wrongCount.label + '」은(는) ' + wrongCount.pick + '개를 골라야 합니다.'); return; }
  if (f_isNumberInvalid(fields, st.values)) { setFeedback('info', '숫자 칸에는 숫자만 입력하세요.'); return; }

  if (puz.graded === false) {
    patchPuzzle(key, { solved: true });
    advancePuzzle();
    return;
  }
  const canons = fields.map((f) => CORE.canonField(f, st.values[f.id]));
  const okCount = fields.filter((f, i) => CORE.fieldHash(SALT, key, f.id, canons[i]) === f.h).length;
  if (okCount === fields.length) {
    const basic = fields.map((f, i) => (f.adv ? null : canons[i])).filter((c) => c !== null);
    const debKey = CORE.debriefKey(SALT, key, basic);
    patchPuzzle(key, { solved: true, attempts: st.attempts + 1, debKey });
    setS({ correctTotal: S.correctTotal + 1 });
    Sound.correct();
    renderSection();
    showDebrief(room, puz, debKey, true);
    return;
  }
  patchPuzzle(key, { attempts: st.attempts + 1, wrong: st.wrong + 1 });
  setS({ wrongTotal: S.wrongTotal + 1 });
  Sound.wrong();
  const msg = puz.isDoor ? '🔒 비밀번호가 틀렸습니다. 경보가 울립니다!'
    : fields.length > 1 ? '✖ ' + fields.length + '개 항목 중 ' + okCount + '개 정답입니다. 다시 확인하세요. (오답은 환자 상태를 악화시킵니다)'
      : '✖ 정답이 아닙니다. 다시 확인하세요. (오답은 환자 상태를 악화시킵니다)';
  setFeedback('bad', msg);
  const card = $('#puzzleCard');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
  updateMonitor();
}
function f_isNumberInvalid(fields, values) {
  return fields.some((f) => f.type === 'number' && CORE.canonField(f, values[f.id]) === '');
}

function useHint(room, puz) {
  const key = pkey(room.id, puz.id);
  const st = getP(key);
  if (st.hints >= 3 || st.solved) return;
  const pen = DATA.config.hintPenaltySec[st.hints];
  patchPuzzle(key, { hints: st.hints + 1 });
  addPenalty(pen);
  Sound.click();
  renderSection();
  setFeedback('info', '힌트 사용: +' + pen / 60 + '분 페널티');
  updateHeader();
}

function showDebrief(room, puz, debKey, fresh) {
  const raw = debKey ? CORE.decryptText(debKey, puz.debriefX) : null;
  let deb = null;
  try { deb = raw ? JSON.parse(raw) : null; } catch (err) { deb = null; }
  const content = deb ? [
    h('div', { class: 'deb-sec' }, h('h4', {}, '✔ 정답 근거'), h('p', {}, deb.why)),
    h('div', { class: 'deb-sec' }, h('h4', {}, '🔑 핵심 개념'), h('p', {}, deb.concept)),
    h('div', { class: 'deb-sec' }, h('h4', {}, '📚 교재 · 출처'),
      h('ul', { class: 'deb-src' }, ...deb.sources.map((s) => h('li', {}, s.label + ' ',
        s.doi ? h('a', { href: 'https://doi.org/' + s.doi, target: '_blank', rel: 'noopener' }, 'doi:' + s.doi) : null,
        s.url ? h('a', { href: s.url, target: '_blank', rel: 'noopener' }, s.url) : null))))
  ] : [h('p', {}, '디브리핑을 불러오지 못했습니다. (교수자 건너뛰기로 해제된 퍼즐일 수 있습니다)')];
  openModal([

function advancePuzzle() {
  const room = currentRoom();
  const next = S.pIdx + 1;
  if (room.id === 'final' && next >= room.puzzles.length) { finishGame(); return; }
  setS({ pIdx: next });
  if (next >= room.puzzles.length) Sound.unlock();
  renderSection();
  $('#main').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSectionClear(room) {
  const nextId = S.plan[S.idx + 1];
  const spent = (S.sectionSec[room.id] || 0) + (elapsedMs() - S.secStartMs) / 1000;
  const st = sectionStats(room.id);
  return h('section', { class: 'puzzle glass' },
    h('h3', {}, '🔓 ' + room.name + ' 해제!'),
    h('p', {}, '구간 소요 시간 ', h('b', {}, fmtTime(spent)), ' · 정답률 ', h('b', {}, st.accuracy === null ? '—' : st.accuracy + '%'), ' · 힌트 ', h('b', {}, String(st.hints)), '회'),

    h('div', { class: 'actions' }, h('button', {
      class: 'btn gold', type: 'button', 'data-autofocus': true,

    }, '다음 구역: ' + ROOM_BY_ID[nextId].name + ' ▶')));

function goNextSection() {
  closeSectionTimer();
  setS({ idx: S.idx + 1, pIdx: 0 });
  renderSection();
  $('#main').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });

function finishGame() {
  closeSectionTimer();

/* ===== 06-result.js — 결과 화면 · PNG 저장 ===== */

function outcomeGrade() {
  const pts = S.deterMax || 0;
  const bad = { tier: 'bad', icon: '🚨', title: 'EMR은 복구했지만, 환자는 악화되었습니다', cls: 'red',
    lead: '대응이 늦어지는 동안 환자 상태가 나빠졌습니다. 아래 기록에서 어느 구간에서 지연·오답이 쌓였는지 되짚어 보세요.' };
  if (S.codeBlue) return Object.assign({ label: '코드 블루 발생 → 중환자실 전동' }, bad);
  if (pts >= 4) return Object.assign({ label: '패혈성 쇼크 의심 → 중환자실 전동' }, bad);
  if (pts >= 2.5) return { tier: 'warn', icon: '⚠️', title: '아슬아슬한 대응', cls: 'gold', label: '조기 대응 성공 → 병동 집중 관찰',
    lead: 'EMR을 복구하고 SBAR 보고를 마쳤지만, 환자는 집중 관찰이 필요한 상태까지 악화되었습니다.' };
  return { tier: 'good', icon: '🏆', title: '환자를 지켜냈습니다!', cls: '', label: '조기 대응 성공 → 병동에서 안정화',
    lead: 'EMR을 복구하고 SBAR 보고로 조기 대응에 성공해, 환자가 병동에서 안정을 되찾았습니다.' };
}
/* 별점: 기준 3개 × 1점. 정답률 기준 70%는 장별 「복습 필요」 판정과 같은 값 */
function overallAccuracy(sections) {
  const a = sections.reduce((t, x) => t + x.attempts, 0), sv = sections.reduce((t, x) => t + x.solved, 0);
  return a ? Math.round((sv / a) * 100) : null;
}
function starCriteria(r) {
  return [
    { ok: r.outcome.tier !== 'bad', label: '환자 중환자실 전동 없음' },
    { ok: r.used <= budgetSec(), label: '제한 시간 ' + fmtTime(budgetSec()) + ' 안에 완료' },
    { ok: r.accuracy !== null && r.accuracy >= 70, label: '전체 정답률 70% 이상 (' + (r.accuracy === null ? '—' : r.accuracy + '%') + ')' }];
}
function personaInfo() {
  const v = getP('final.B').values;
  const room = ROOM_BY_ID.final;
  const opt = room.puzzles[1].fields[0].options.find((o) => o.v === v.persona);
  return { title: opt ? opt.t : '(선택하지 않음)', line: String(v.line || '').slice(0, 80) };
}
function resultSummary() {
  const sections = S.plan.map((id) => Object.assign({ id, name: ROOM_BY_ID[id].name }, sectionStats(id)));
  const used = usedSec();
  const r = { sections, chapters: chapterStats(), used, hints: totalHints(), outcome: outcomeGrade(), persona: personaInfo(), accuracy: overallAccuracy(sections) };
  r.criteria = starCriteria(r);
  r.stars = r.criteria.filter((c) => c.ok).length;
  return r;
}

/* D. 숫자 카드: 시간·정확도·도움 3묶음, 상태 색(ok·warn·bad) */
function kpiGroups(r) {
  const budget = budgetSec();
  const att = r.sections.reduce((t, x) => t + x.attempts, 0), sol = r.sections.reduce((t, x) => t + x.solved, 0);
  const rooms = Math.max(1, S.plan.length), hpr = r.hints / rooms;
  const st = (lv) => ({ ok: '양호', warn: '주의', bad: '개선 필요' })[lv];
  const timeLv = r.used <= budget ? 'ok' : r.used <= budget * 1.2 ? 'warn' : 'bad';
  const accLv = r.accuracy === null ? 'warn' : r.accuracy >= 70 ? 'ok' : r.accuracy >= 50 ? 'warn' : 'bad';
  const hintLv = hpr <= 1 ? 'ok' : hpr <= 2 ? 'warn' : 'bad';
  const card = (lv, icon, title, big, rows, note) => h('div', { class: 'kgroup glass lv-' + lv },
    h('div', { class: 'kg-head' }, h('span', {}, icon + ' ' + title), h('span', { class: 'kg-lv' }, st(lv))),
    h('div', { class: 'kg-big' }, big),
    h('dl', { class: 'kg-rows' }, ...rows.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])),
    h('div', { class: 'kg-note' }, note));
  return h('div', { class: 'kgroups' },
    card(timeLv, '⏱', '시간', fmtTime(r.used),
      [['제한 시간', fmtTime(budget)], ['순수 풀이', fmtTime(r.used - S.penaltySec)], ['페널티', '+' + fmtTime(S.penaltySec)]],
      '양호: 제한 시간 내 · 주의: 20% 이내 초과'),
    card(accLv, '🎯', '정확도', r.accuracy === null ? '—' : r.accuracy + '%',
      [['정답 / 제출', sol + ' / ' + att + '회'], ['오답 제출', S.wrongTotal + '회']],
      '양호: 70% 이상 · 주의: 50~69%'),
    card(hintLv, '💡', '도움', r.hints + '회',
      [['구간당 평균', hpr.toFixed(1) + '회'], ['구간 수', rooms + '개']],
      '양호: 구간당 1회 이하 · 주의: 2회 이하'));
}

/* C. 환자 경과 그래프: 기록된 악화 점수를 NEWS2로 환산해 구간별로 표시 */
function courseChart() {
  const pts = S.course || [];
  const wrap = (...kids) => h('section', { class: 'puzzle glass course' }, h('h3', {}, '📈 환자 경과 (NEWS2)'), ...kids);
  if (pts.length < 2) return wrap(h('p', { class: 'small' }, '이 게임에는 경과 기록이 없습니다. (경과 기록 기능이 추가되기 전에 시작한 게임)'));
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs, ...kids) => {
    const el = document.createElementNS(NS, tag);
    Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, v));
    kids.forEach((c) => el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return el;
  };
  const news = (p) => CORE.calcNEWS2(vitalsAt(p));
  const W = 800, H = 250, L = 34, R = 14, T = 30, B = 28, yMax = 18;
  const tMax = Math.max(1, pts[pts.length - 1].t);
  const x = (t) => L + (t / tMax) * (W - L - R);
  const y = (n) => T + (1 - Math.min(n, yMax) / yMax) * (H - T - B);
  // 구간 나누기
  const segs = [];
  pts.forEach((q, i) => {
    const cur = segs[segs.length - 1];
    if (!cur || cur.r !== q.r) segs.push({ r: q.r, i0: i, i1: i }); else cur.i1 = i;
  });
  segs.forEach((g, k) => {
    g.t0 = k === 0 ? 0 : pts[g.i0].t;
    g.t1 = k < segs.length - 1 ? pts[segs[k + 1].i0].t : tMax;
    g.n0 = news(pts[Math.max(0, g.i0 - 1)].p);
    g.n1 = news(pts[k < segs.length - 1 ? segs[k + 1].i0 : g.i1].p);
  });
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, class: 'course-svg', role: 'img', 'aria-label': '게임 경과 시간에 따른 환자 NEWS2 점수 변화' });
  // 위험도 띠: 0~4 낮음, 5~6 중간, 7 이상 높음(NEWS2 임상 대응 기준)
  [[0, 5, '#ECFDF3'], [5, 7, '#FFF4DE'], [7, yMax, '#FDECE7']].forEach(([a, b, c]) =>
    svg.appendChild(sv('rect', { x: L, y: y(b), width: W - L - R, height: y(a) - y(b), fill: c })));
  [[5, '중간 위험 5', '#B45309', 'below'], [7, '높은 위험 7', '#C4320A', 'above']].forEach(([n, t, c, pos]) => { // 두 표시가 겹치지 않게 7은 선 위, 5는 선 아래
    svg.appendChild(sv('line', { x1: L, x2: W - R, y1: y(n), y2: y(n), stroke: c, 'stroke-dasharray': '4 4', 'stroke-width': 1 }));
    svg.appendChild(sv('text', { x: W - R - 4, y: y(n), dy: pos === 'above' ? '-0.35em' : '1.05em', 'text-anchor': 'end', class: 'c-thr', fill: c }, t));
  });
  [0, 5, 10, 15].forEach((n) => svg.appendChild(sv('text', { x: L - 6, y: y(n) + 4, 'text-anchor': 'end', class: 'c-ax' }, String(n))));
  // 구간 경계와 이름
  segs.forEach((g, k) => {
    if (k > 0) svg.appendChild(sv('line', { x1: x(g.t0), x2: x(g.t0), y1: T - 6, y2: H - B, stroke: '#9AA0A8', 'stroke-width': 1, 'stroke-dasharray': '2 3' }));
    const wpx = x(g.t1) - x(g.t0);
    const room = ROOM_BY_ID[g.r];
    if (room && wpx > 46) svg.appendChild(sv('text', { x: (x(g.t0) + x(g.t1)) / 2, y: T - 12, 'text-anchor': 'middle', class: 'c-room' }, room.short || room.name));
  });
  // 선과 면
  const line = pts.map((q) => `${x(q.t).toFixed(1)},${y(news(q.p)).toFixed(1)}`);
  svg.appendChild(sv('polygon', { points: `${x(0)},${y(0)} ${line.join(' ')} ${x(tMax)},${y(0)}`, fill: 'rgba(110,34,51,.10)' }));
  svg.appendChild(sv('polyline', { points: line.join(' '), fill: 'none', stroke: '#6E2233', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
  // 코드 블루 지점
  const cb = pts.find((q) => q.p >= 5);
  if (cb) {
    svg.appendChild(sv('circle', { cx: x(cb.t), cy: y(news(cb.p)), r: 6, fill: '#C4320A', stroke: '#fff', 'stroke-width': 2 }));
    svg.appendChild(sv('text', { x: Math.min(x(cb.t), W - R - 80), y: y(news(cb.p)) - 10, class: 'c-cb' }, 'CODE BLUE ' + fmtTime(cb.t)));
  }
  svg.appendChild(sv('text', { x: L, y: H - 8, class: 'c-ax' }, '0:00'));
  svg.appendChild(sv('text', { x: W - R, y: H - 8, 'text-anchor': 'end', class: 'c-ax' }, fmtTime(tMax)));
  svg.appendChild(sv('text', { x: (L + W - R) / 2, y: H - 8, 'text-anchor': 'middle', class: 'c-ax' }, '게임 경과 시간 (페널티 제외)'));
  // 해석 문장
  const worst = segs.slice().sort((a, b) => (b.n1 - b.n0) - (a.n1 - a.n0))[0];
  const peak = pts.reduce((m, q) => (q.p > m.p ? q : m), pts[0]);
  const notes = [h('li', {}, '최고 NEWS2 ', h('b', {}, String(news(peak.p)) + '점'), ' (모의 시각 ' + simClock(peak.p) + ', ' + (news(peak.p) >= 7 ? '긴급 대응 수준' : news(peak.p) >= 5 ? '긴급 평가 수준' : '낮은 위험') + ')')];
  if (worst && worst.n1 > worst.n0) notes.push(h('li', {}, '가장 크게 악화된 구간: ', h('b', {}, (ROOM_BY_ID[worst.r] || {}).name || worst.r), ` (NEWS2 ${worst.n0} → ${worst.n1}, +${worst.n1 - worst.n0})` + (worst.n1 >= 5 ? ' — 이 구간의 지연·오답을 먼저 되짚어 보세요.' : '')));
  else notes.push(h('li', {}, '어느 구간에서도 NEWS2가 오르지 않았습니다. 조기 대응이 잘 이루어졌습니다.'));
  return wrap(h('p', { class: 'small' }, '시간이 지나거나 오답을 내면 환자가 악화되고, 정답을 맞히면 악화 속도가 늦춰집니다(한 번 악화된 상태는 되돌아가지 않음). 배경색은 NEWS2 임상 대응 기준(5점 이상 긴급 평가, 7점 이상 긴급 대응)입니다.'),
    svg, h('ul', { class: 'course-notes' }, ...notes));
}

function timeBar(used, budget) {
  const span = Math.max(used, budget) || 1;
  const inPct = (Math.min(used, budget) / span) * 100, overPct = (Math.max(0, used - budget) / span) * 100;
  const over = used > budget;
  return h('div', { class: 'tbar-wrap' },
    h('div', { class: 'tbar-label' }, h('span', {}, '사용 시간 ', h('b', {}, fmtTime(used)), ' / 제한 ' + fmtTime(budget)),
      h('span', { class: over ? 'over' : 'in' }, over ? '⏱ ' + fmtTime(used - budget) + ' 초과' : '⏱ ' + fmtTime(budget - used) + ' 여유')),
    h('div', { class: 'tbar', role: 'img', 'aria-label': over ? '제한 시간 초과' : '제한 시간 안에 완료' },
      h('i', { class: 'in', style: 'width:' + inPct + '%' }), h('i', { class: 'over', style: 'width:' + overPct + '%' }),
      over ? h('span', { class: 'limit', style: 'left:' + (budget / span) * 100 + '%' }) : null));
}

/* ----- PNG (캔버스 직접 그리기, 외부 라이브러리 없음) ----- */
function savePng() {
  try {
    const r = resultSummary();
    const W = 1200;
    const rowH = 34;
    const people = rosterLines(S);
    const peopleRows = [];
    for (let i = 0; i < people.length; i += 3) peopleRows.push(people.slice(i, i + 3).join('   '));
    const shift = peopleRows.length * 30;
    const course = S.course || [];
    const chartH = course.length >= 2 ? 230 : 0;
    const H = 540 + shift + chartH + r.sections.length * rowH + Math.ceil(r.chapters.length / 2) * rowH;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const c = cv.getContext('2d');

/* ===== 07-teacher.js — 교수자 모드 (?teacher=1 + 비밀번호) =====
 * 비밀번호는 평문으로 저장하지 않는다. PBKDF 유사 반복 해시로 키를 만들고,
 * 확인 해시(check)가 맞을 때만 암호화된 정답표(blob)를 복호화한다. */

let TEACHER = null; // { answers: {key:{fieldId:value}}, todo: [] }
const TEACHER_SESSION_KEY = 'cbni_teacher_session';

function teacherEnabled() { return params.get('teacher') === '1'; }

function unlockTeacher(pw) {
  const key = CORE.stretchKey(pw, SALT + '|teacher', 3000);
  if (CORE.sha256Hex('chk|' + key) !== DATA.teacher.check) return false;
  const raw = CORE.decryptText(key, DATA.teacher.blob);
  if (!raw) return false;
  try {
    TEACHER = JSON.parse(raw);
  } catch (err) {
    return false;
  }
  try { sessionStorage.setItem(TEACHER_SESSION_KEY, key); } catch (err) { /* 세션 저장 불가: 매번 비밀번호 입력 */ }
  return true;
}
function restoreTeacherSession() {
  let key = null;
  try { key = sessionStorage.getItem(TEACHER_SESSION_KEY); } catch (err) { key = null; }
  if (!key || CORE.sha256Hex('chk|' + key) !== DATA.teacher.check) return;
  const raw = CORE.decryptText(key, DATA.teacher.blob);
  try { TEACHER = raw ? JSON.parse(raw) : null; } catch (err) { TEACHER = null; }
}

function teacherLogin() {
  const input = h('input', { type: 'password', id: 'tpw', autocomplete: 'off', 'data-autofocus': true, placeholder: '교수자 비밀번호' });
  const msg = h('p', { class: 'feedback', role: 'status' });
  const tryIt = () => {
    if (unlockTeacher(input.value)) { closeModal(); openTeacherPanel(); refreshAfterTeacher(); }
    else { msg.className = 'feedback bad'; msg.textContent = '비밀번호가 맞지 않습니다.'; input.select(); }
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryIt(); });
  openModal([h('h2', {}, '🎓 교수자 모드'), h('label', { for: 'tpw' }, '비밀번호'), input, msg,
    h('div', { class: 'actions' }, h('button', { class: 'btn primary', type: 'button', onclick: tryIt }, '잠금 해제'),
      h('button', { class: 'btn ghost', type: 'button', onclick: closeModal }, '취소'))], { label: '교수자 로그인' });
}
function refreshAfterTeacher() {
  if (S && !S.finished) renderSection();
  else if (!S) renderStart();
}

function answerText(room, puz) {
  const ans = (TEACHER.answers[pkey(room.id, puz.id)]) || {};
  return activeFields(puz, S ? S.diff : 'adv').filter((f) => ans[f.id] !== undefined).map((f) => {
    const a = ans[f.id];
    const optText = (v) => { const o = (f.options || []).find((x) => x.v === v); return o ? o.t : v; };
    const val = Array.isArray(a) ? a.map(optText).join(f.type === 'order' ? ' → ' : ' / ') : optText(a);
    return (fieldLabel(puz, f) || f.id).slice(0, 60) + ' → ' + val;
  });
}

function teacherPuzzleTools(room, puz) {
  if (!TEACHER || puz.graded === false) return null;
  return h('button', { class: 'btn danger', type: 'button', onclick: () => teacherFill(room, puz) }, '🎓 정답 자동 입력');
}
function teacherFill(room, puz) {
  const key = pkey(room.id, puz.id);
  const ans = TEACHER.answers[key] || {};
  const values = Object.assign({}, getP(key).values, ans);
  patchPuzzle(key, { values });
  renderSection();
}

function teacherSkipSection() {
  if (!S || S.finished) return;
  const room = currentRoom();
  const puzzles = Object.assign({}, S.puzzles);
  room.puzzles.forEach((p) => {
    const key = pkey(room.id, p.id);
    const cur = getP(key);
    if (cur.solved) return;
    const ans = TEACHER.answers[key] || {};
    const basic = p.fields.filter((f) => !f.adv && ans[f.id] !== undefined).map((f) => CORE.canonField(f, ans[f.id]));
    puzzles[key] = Object.freeze(Object.assign({}, cur, { solved: true, skipped: true, values: Object.assign({}, ans), debKey: p.graded === false ? null : CORE.debriefKey(SALT, key, basic) }));
  });
  setS({ puzzles });
  closeModal();
  if (room.id === 'final') { finishGame(); return; }
  setS({ pIdx: room.puzzles.length });
  renderSection();
}

function openTeacherPanel() {
  if (!TEACHER) { teacherLogin(); return; }
  const blocks = [h('h2', {}, '🎓 교수자 메뉴')];
  if (S && !S.finished) {
    const room = currentRoom();
    const puz = room.puzzles[Math.min(S.pIdx, room.puzzles.length - 1)];
    blocks.push(h('div', { class: 'deb-sec' }, h('h4', {}, '현재 퍼즐 정답 · ' + room.short + ' ' + puz.id),
      h('ul', { class: 'deb-src' }, ...answerText(room, puz).map((t) => h('li', {}, t)))));
    blocks.push(h('div', { class: 'actions' },
      h('button', { class: 'btn danger', type: 'button', onclick: () => { if (confirm('현재 구간을 건너뛸까요? (정답률 집계에서 제외)')) teacherSkipSection(); } }, '⏭ 현재 구간 건너뛰기')));
  }
  const picked = classRooms();
  const boxes = CLASS_PICKABLE.map((id) => h('label', { class: 'choice' },
    h('input', { type: 'checkbox', value: id, checked: picked.includes(id), 'data-classroom': '1' }), h('span', {}, ROOM_BY_ID[id].name)));
  const shareUrl = h('code', { id: 'shareUrl' }, location.origin + location.pathname + '?rooms=' + picked.join(','));
  blocks.push(h('div', { class: 'deb-sec' }, h('h4', {}, '수업 모드에서 쓸 방 3개'), h('div', { class: 'choice-grid' }, ...boxes),
    h('div', { class: 'actions' }, h('button', {
      class: 'btn primary', type: 'button', onclick: () => {
        const ids = $$('input[data-classroom]').filter((x) => x.checked).map((x) => x.value);
        if (!validRoomSelection(ids)) { alert('방을 정확히 3개 골라 주세요.'); return; }
        storage.set(CLASS_ROOMS_KEY, ids);
        shareUrl.textContent = location.origin + location.pathname + '?rooms=' + ids.join(',');
        if (!S) renderStart();
      }
    }, '이 기기에 저장')),
    h('p', { class: 'small' }, '조별 기기마다 설정하기 번거로우면 아래 주소를 나눠 주세요: '), shareUrl));
  if (Array.isArray(TEACHER.todo) && TEACHER.todo.length) {
    blocks.push(h('div', { class: 'deb-sec' }, h('h4', {}, 'TODO: 확인 필요 (' + TEACHER.todo.length + ')'),
      h('ul', { class: 'deb-src' }, ...TEACHER.todo.map((t) => h('li', {}, t)))));
  }
  blocks.push(h('div', { class: 'actions' },
    h('button', { class: 'btn danger', type: 'button', onclick: () => { if (confirm('이 기기의 진행 기록을 모두 지울까요?')) { clearSaved(); location.reload(); } } }, '🗑 진행 초기화'),
    h('button', { class: 'btn ghost', type: 'button', onclick: closeModal }, '닫기')));
  openModal(blocks, { label: '교수자 메뉴' });
}

/* ===== 07b-roster.js — 대응팀 등록: 반 · 학번 · 성명 (조원 1~5명) =====
 * 입력값은 이 기기의 localStorage에만 저장된다(외부 전송 없음).
 * 공용 태블릿이면 수업 후 교수자 메뉴의 「진행 초기화」로 지운다. */

const ROSTER = Object.freeze({
  maxMembers: 5,
  classes: Object.freeze(['A', 'B', 'C', 'D', 'E', 'F', '전공심화과정']),
  sidLength: 7,
  sidPattern: /^[0-9]{7}$/,
  // 한글 또는 영문 이름(글자수 제한 없음). 영문 이름 사이의 띄어쓰기는 허용(예: Jong Pil Jeong)
  namePattern: /^[가-힣A-Za-z]+( [가-힣A-Za-z]+)*$/
});

const normSpace = (v) => String(v || '').trim().replace(/\s+/g, ' ');
const normSid = (v) => String(v || '').replace(/[\s-]/g, '');
function normCls(v) {
  const s = normSpace(v);
  // A~F 같은 반 기호에만 「반」을 붙인다(「전공심화과정」은 그대로).
  return /^[A-Za-z0-9]$/.test(s) ? s + '반' : s;
}

/** 화면 머리·결과에 쓰는 짧은 표시 이름. 예: 「3반 · 홍길동 외 3명」 */
function rosterLabel(cls, members) {
  if (!Array.isArray(members) || !members.length) return cls || '대응팀';
  const extra = members.length > 1 ? ' 외 ' + (members.length - 1) + '명' : '';
  return cls + ' · ' + members[0].name + extra;
}
/** 결과 화면·PNG용 전체 명단. 예: 「20231234 홍길동」 배열 */
function rosterLines(st) {
  return Array.isArray(st.members) ? st.members.map((m) => m.sid + ' ' + m.name) : [];
}

function buildRosterForm(onEnter) {
  const clsInput = h('select', { id: 'cls', 'data-autofocus': true },
    h('option', { value: '', selected: true, disabled: true }, '반 선택'),
    ROSTER.classes.map((c) => h('option', { value: c }, normCls(c))));
  // 학번 칸: 숫자 외 문자는 입력 즉시 지운다. 자릿수는 잘라내지 않고 안내한다.
  //  - 7자리 초과: 입력하는 즉시 경고
  //  - 7자리 미만: 칸을 벗어날 때 경고(입력 도중에는 재촉하지 않음)
  const list = h('div', { class: 'member-list', id: 'memberList' });
  const sidMsg = h('p', { class: 'sid-msg', id: 'sidMsg', 'aria-live': 'polite' });
  const sidProblem = (t) => {
    const n = t.value.length;
    const L = ROSTER.sidLength;
    if (n === 0 || n === L) return '';
    if (n < L && !t.dataset.touched) return '';
    return '학번은 숫자 ' + L + '자리로 입력하세요. (현재 ' + n + '자리 · ' + (n > L ? (n - L) + '자리 초과' : (L - n) + '자리 부족') + ')';
  };
  const refreshSidMsg = () => {
    const lines = [];
    $$('[data-k=sid]', list).forEach((t, i) => {
      const p = sidProblem(t);
      if (p) { t.setAttribute('aria-invalid', 'true'); t.setAttribute('aria-describedby', 'sidMsg'); lines.push((i + 1) + '번째 조원: ' + p); }
      else { t.toggleAttribute('aria-invalid', false); t.toggleAttribute('aria-describedby', false); }
    });
    const text = lines.join(' / ');
    if (sidMsg.textContent !== text) sidMsg.textContent = text;
  };
  const onSidInput = (e) => {
    const t = e.target;
    const clean = t.value.replace(/[^0-9]/g, '').slice(0, 20);
    if (t.value !== clean) t.value = clean;
    refreshSidMsg();
  };
  const onSidBlur = (e) => {
    if (e.target.value) e.target.dataset.touched = '1';
    refreshSidMsg();
  };
  const addBtn = h('button', { type: 'button', class: 'btn ghost', onclick: () => addRow() }, '+ 조원 추가');

  const rowValues = () => $$('.member-row', list).map((r) => ({
    sid: r.querySelector('[data-k=sid]').value,
    name: r.querySelector('[data-k=name]').value
  }));
  function draw(values) {
    list.replaceChildren(...values.map((m, i) => {
      const sidId = 'sid' + i;
      const nameId = 'name' + i;
      return h('div', { class: 'member-row' },
        h('span', { class: 'member-no', 'aria-hidden': 'true' }, String(i + 1)),
        h('label', { class: 'sr-only', for: sidId }, (i + 1) + '번째 조원 학번'),
        h('input', { type: 'text', id: sidId, 'data-k': 'sid', inputmode: 'numeric', pattern: '[0-9]*', placeholder: '학번(숫자 7자리)', autocomplete: 'off', value: m.sid, oninput: onSidInput, onblur: onSidBlur }),
        h('label', { class: 'sr-only', for: nameId }, (i + 1) + '번째 조원 성명'),
        h('input', { type: 'text', id: nameId, 'data-k': 'name', placeholder: '성명(한글 또는 영문)', autocomplete: 'off', autocapitalize: 'words', spellcheck: 'false', value: m.name }),
        values.length > 1
          ? h('button', { type: 'button', class: 'icon-btn', 'aria-label': (i + 1) + '번째 조원 삭제', onclick: () => removeRow(i) }, '✕')
          : h('span', {}));
    }));
    refreshSidMsg();
    addBtn.disabled = values.length >= ROSTER.maxMembers;
    addBtn.textContent = values.length >= ROSTER.maxMembers ? '조원은 최대 ' + ROSTER.maxMembers + '명' : '+ 조원 추가';
  }
  function addRow() {
    const values = rowValues();
    if (values.length >= ROSTER.maxMembers) return;
    draw(values.concat({ sid: '', name: '' }));
    const inputs = $$('[data-k=sid]', list);
    inputs[inputs.length - 1].focus();
  }
  function removeRow(i) {
    draw(rowValues().filter((_, j) => j !== i));
  }
  draw([{ sid: '', name: '' }]);

  const el = h('div', { class: 'roster' },
    h('div', { class: 'roster-cls' }, h('label', { for: 'cls' }, '반'), clsInput),
    h('div', {}, h('div', {}, '조원 (학번 · 성명) ', h('span', { class: 'small' }, '— 대표 1명은 필수, 최대 ' + ROSTER.maxMembers + '명')), list, sidMsg, addBtn));
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') onEnter(); });

  /** 입력 검증. 실패하면 {ok:false, error, focus} */
  function read() {
    if (!ROSTER.classes.includes(clsInput.value)) return { ok: false, error: '반을 선택하세요. (A~F반 또는 전공심화과정)', focus: clsInput };
    const cls = normCls(clsInput.value);
    const rows = $$('.member-row', list);
    const members = [];
    for (let i = 0; i < rows.length; i++) {
      const sidEl = rows[i].querySelector('[data-k=sid]');
      const nameEl = rows[i].querySelector('[data-k=name]');
      const sid = normSid(sidEl.value);
      const name = normSpace(nameEl.value);
      if (i > 0 && !sid && !name) continue; // 비워 둔 추가 행은 무시
      if (!ROSTER.sidPattern.test(sid)) return { ok: false, error: (i + 1) + '번째 조원의 학번을 숫자 7자리로 입력하세요.', focus: sidEl };
      if (!ROSTER.namePattern.test(name)) return { ok: false, error: (i + 1) + '번째 조원의 성명을 한글 또는 영문으로 입력하세요. (숫자·특수문자 불가)', focus: nameEl };
      if (members.some((m) => m.sid === sid)) return { ok: false, error: '학번 ' + sid + '이(가) 중복 입력되었습니다.', focus: sidEl };
      members.push(Object.freeze({ sid, name }));
    }
    return { ok: true, cls, members: Object.freeze(members) };
  }
  return { el, read, focus: () => clsInput.focus() };
}

/* ===== 08-main.js — 시작 화면·헤더·타이머·키보드·부팅 ===== */

function renderStart() {
  const saved = loadSaved();
  const picked = classRooms();
  const seg = (name, items, def) => h('div', { class: 'seg', role: 'radiogroup' }, ...items.map(([v, t]) =>
    h('label', {}, h('input', { type: 'radio', name, value: v, checked: v === def }), h('span', {}, t))));
  const roomList = h('ul', { class: 'room-list', id: 'roomList' });
  const drawRooms = () => {
    const mode = ($('input[name=mode]:checked') || {}).value || 'full';
    const plan = buildPlan(mode);
    roomList.replaceChildren(...DATA.rooms.map((r) => h('li', { class: plan.includes(r.id) ? '' : 'off' }, r.icon + ' ' + r.name)));
  };
  const msg = h('p', { class: 'feedback', role: 'status' });
  const start = () => {
    const r = roster.read();
    if (!r.ok) { msg.className = 'feedback bad'; msg.textContent = r.error; r.focus.focus(); return; }
    const mode = $('input[name=mode]:checked').value;
    const diff = $('input[name=diff]:checked').value;
    if (saved && !saved.finished && !confirm('이어하던 게임이 있습니다. 새로 시작하면 지워집니다. 계속할까요?')) return;
    S = createState(rosterLabel(r.cls, r.members), mode, diff, { cls: r.cls, members: r.members });
    persist();
    lastStage = -1;
    Sound.unlock();
    renderSection();
    updateHeader();
    updateMonitor();
  };
  const resume = () => {
    resumeState(saved);
    lastStage = Math.floor(S.deterMax || 0);
    if (S.finished) renderResult(); else renderSection();
    updateHeader();
    updateMonitor();
  };
  const hero = h('section', { class: 'hero glass intro' },
    h('span', { class: 'badge gold' }, DATA.meta.subtitle),
    h('div', { class: 'hero-head' },
      h('h2', {}, DATA.meta.title)),
    h('p', { class: 'lead' }, '야간 근무 중 7병동 EMR이 사이버 공격 의심으로 잠겼다. 712호 ', h('b', {}, '김○○ 님(72세 남, 폐렴 입원 3일차)'),
      '의 활력징후는 점점 나빠지고, 패혈증 AI 경보(ESM)는 울렸다 꺼지기를 반복한다. 정보간호사 대응팀이 되어 각 공간의 시스템을 복구하고, 마지막에 담당의에게 SBAR로 보고하라.'),
    h('ul', { class: 'small hero-tips' },
      h('li', {}, '오른쪽 모니터의 환자 상태는 시간이 지나거나 오답을 내면 악화됩니다.'),
      h('li', {}, '힌트는 3단계(넛지 → 부분 공개 → 거의 정답), 사용 시 1·2·3분 페널티가 붙습니다.'),
      h('li', {}, '퍼즐을 풀면 디브리핑 카드와 단서 카드를 얻습니다. 진행 상황은 이 기기에 자동 저장됩니다.'),
      h('li', {}, '키보드: Tab 이동 · Enter 제출 · H 힌트 · M 음소거')));
  const roster = buildRosterForm(() => start());
  const form = h('section', { class: 'puzzle glass' },
    h('h3', {}, '대응팀 등록'),
    roster.el,
    h('div', { class: 'form-grid' },
      h('div', {}, h('div', {}, '모드'), seg('mode', [['full', '전체 · 7구간 45분'], ['class', '수업 · 5구간 30분']], 'full')),
      h('div', {}, h('div', {}, '난이도'), seg('diff', [['basic', '기본'], ['adv', '심화(계산·판단↑)']], 'basic'))),
    h('div', { style: 'margin-top:1rem' }, h('div', { class: 'small' }, '이번 게임에서 열리는 구간 (수업 모드 방 3개: ' + picked.map((id) => ROOM_BY_ID[id].short).join(', ') + ' — 교수자가 바꿀 수 있음)'), roomList),
    msg,
    h('div', { class: 'actions' },
      h('button', { class: 'btn primary', type: 'button', onclick: start }, '🚨 출동 (게임 시작)'),
      saved ? h('button', { class: 'btn gold', type: 'button', onclick: resume }, saved.finished ? '📊 지난 결과 보기' : '▶ 이어하기 (' + saved.team + ')') : null));
  form.addEventListener('change', drawRooms);
  $('#main').replaceChildren(hero, form);
  drawRooms();
  renderMinimap();
  setTimeout(() => roster.focus(), 50);
}

function updateHeader() {
  const timer = $('#timer');
  const hc = $('#hintCount');
  if (!S) { timer.textContent = '--:--'; hc.textContent = '0'; return; }
  const rem = remainingSec();
  timer.textContent = S.finished ? fmtTime(usedSec()) : fmtTime(rem);
  timer.previousElementSibling.textContent = S.finished ? '총 소요' : rem < 0 ? '초과 시간' : '남은 시간';
  timer.classList.toggle('over', !S.finished && rem < 0);
  timer.classList.toggle('low', !S.finished && rem >= 0 && rem < 300);
  hc.textContent = String(totalHints());
  const tb = $('#teamBadge');
  tb.classList.remove('hidden');
  tb.textContent = '👥 ' + S.team;
  const badge = $('#modeBadge');
  badge.classList.remove('hidden');
  badge.textContent = (S.mode === 'full' ? '전체 모드' : '수업 모드') + ' · ' + (S.diff === 'adv' ? '심화' : '기본');
}

function tick() {
  if (!S || S.finished) return;
  updateHeader();
  updateMonitor();
}

function renderTests() {
  const res = runSelfTests(CORE, TL);
  $('#main').replaceChildren(h('section', { class: 'puzzle glass' },
    h('h3', {}, '🧪 자동 테스트 (NEWS2·qSOFA·SHA-256)'),
    h('p', {}, h('b', { style: 'color:' + (res.fail ? 'var(--danger)' : 'var(--primary-2)') }, res.pass + '개 통과 · ' + res.fail + '개 실패')),
    h('ul', { class: 'tests small' }, ...res.results.map((r) => h('li', { class: r.ok ? '' : 'bad' }, (r.ok ? '✔ ' : '✖ ') + r.name + (r.ok ? '' : ' — 기대 ' + JSON.stringify(r.expected) + ', 실제 ' + JSON.stringify(r.actual))))),
    h('div', { class: 'actions' }, h('a', { class: 'btn ghost', href: location.pathname }, '게임으로 돌아가기'))));
}

function onKey(e) {
  if (e.key === 'Escape' && modalOpen()) {
    const sticky = $('#overlay .btn.primary[data-autofocus]');
    if (sticky && $('#overlay').querySelector('h2') && /정답!/.test($('#overlay h2').textContent)) sticky.click();
    else closeModal();
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'select', 'textarea'].includes(tag) || e.metaKey || e.ctrlKey || e.altKey || modalOpen()) return;
  if (e.key === 'h' || e.key === 'H' || e.key === 'ㅗ') { const b = $('#hintBtn'); if (b && !b.disabled) b.click(); }
  if (e.key === 'm' || e.key === 'M' || e.key === 'ㅡ') $('#muteBtn').click();
}

function boot() {
  document.title = DATA.meta.title + ' · AI융합 간호정보학 방탈출';
  $('#gameTitle').textContent = DATA.meta.title;
  $('#footer').textContent = DATA.meta.footer;
  buildVitalsDom();
  startEcg();
  const mute = $('#muteBtn');
  const drawMute = () => { mute.textContent = Sound.isMuted() ? '🔇' : '🔊'; mute.setAttribute('aria-pressed', Sound.isMuted() ? 'true' : 'false'); mute.setAttribute('aria-label', Sound.isMuted() ? '소리 켜기' : '음소거'); };
  mute.addEventListener('click', () => { Sound.setMuted(!Sound.isMuted()); drawMute(); });
  drawMute();
  if (teacherEnabled()) {
    restoreTeacherSession();
    const tb = $('#teacherBtn');
    tb.classList.remove('hidden');
    tb.addEventListener('click', openTeacherPanel);
  }
  document.addEventListener('keydown', onKey);
  if (params.get('test') === '1') renderTests();
  else renderStart();
  updateMonitor();
  setInterval(tick, 1000);
  window.addEventListener('beforeunload', persist);
  document.addEventListener('visibilitychange', persist);
}

boot();

})();
</script>
